<!DOCTYPE html>

<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title> Vremea (Open-Meteo)</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="wrap">
        <h1> Vremea pe oras (Geocoding -> Forecast)</h1>

        <div class="card">
            <div class="row">
                <input id="q" placeholder="Scrie un oras (ex: Bucuresti)" value = "Bucuresti" />
                <button id="searchBtn">Cauta</button>
                <span class="muted">Tip: scrie minim 3 litere pentru rezultate mai bune.</span>
            </div>

            <p id="status" class="muted"></p>
            <p id="err" class="error"></p>

            <div id="pickWrap" style="display: none; margin-top: 10px">
                <div class="row">
                    <label for="pick" class="muted">Alege locatia:</label>
                    <select id="pick"></select>
                    <button id="loadBtn">Afiseaza vremea</button>
                </div>
            </div>
        </div>

        <div id="out" class="card" style="display: none;">
            <div class="row" style="justify-content: space-between;">
                <div>
                    <h2 id="place"></h2>
                    <div id="meta" class="muted"></div>
                </div>
                <div class="pill" id="now"></div>
            </div>

            <div class="grid2">
                <div>
                    <h3> Urmatoarele 12 ore</h3>
                    <table>
                        <thead>
                            <tr>
                                <th>Ora</th>
                                <th>Temp</th>
                                <th>Vant</th>
                                <th>Cod</th>
                            </tr>
                        </thead>
                        <tbody id="hourRows"></tbody>
                    </table>
                </div>

                <div>
                    <h3>Urmatoarele 7 zile</h3>
                    <table>
                        <thead>
                            <tr>
                                <th>Zi</th>
                                <th>Min / Max</th>
                                <th>Cod</th>
                            </tr>
                        </thead>
                        <tbody id="dayRows"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
